<style>
  .phone {
    width: min(100%, 340px);
    aspect-ratio: 9 / 19.5;
    margin: 0 auto;
    border-radius: 38px;
    border: 8px solid #101115;
    background: #fbfaf7;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    position: relative;
    color: #171b20;
    box-shadow: 0 24px 70px rgba(17, 20, 24, 0.24);
  }
  .screen {
    height: 100%;
    padding: 18px 17px 14px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(217,229,212,.68), transparent 31%), #fbfaf7;
  }
  .island {
    width: 82px;
    height: 21px;
    border-radius: 999px;
    background: #101115;
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
  }
  .status, .header, .candidate-meta, .candidate-actions {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
  }
  .status {
    margin-top: 18px;
    font-size: 11px;
    font-weight: 760;
  }
  .header { margin-top: 18px; }
  .title {
    font-size: 31px;
    font-weight: 850;
    line-height: 1;
    letter-spacing: 0;
  }
  .sub {
    font-size: 11px;
    color: #6f7782;
    margin-top: 5px;
  }
  .theme {
    border-radius: 999px;
    padding: 7px 9px;
    font-size: 10px;
    font-weight: 760;
    background: rgba(255,255,255,.72);
    border: 1px solid rgba(23,27,32,.08);
    white-space: nowrap;
  }
  .focus-card {
    margin-top: 18px;
    border-radius: 26px;
    padding: 17px;
    min-height: 148px;
    box-sizing: border-box;
    background: radial-gradient(circle at 82% 12%, rgba(255,255,255,.36), transparent 26%),
      linear-gradient(142deg, #d9e5d4 0%, #f0e8d8 52%, #e3b99e 100%);
    color: #1d2821;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 18px 42px rgba(94,111,88,.2);
  }
  .candidate-meta {
    font-size: 10px;
    font-weight: 820;
    letter-spacing: .04em;
    text-transform: uppercase;
    opacity: .68;
  }
  .focus-title {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 850;
    line-height: 1.05;
  }
  .focus-note {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.35;
    color: rgba(29,40,33,.72);
  }
  .duration {
    display: flex;
    gap: 5px;
  }
  .pill, .start {
    border-radius: 999px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 820;
    background: rgba(255,255,255,.58);
    white-space: nowrap;
  }
  .pill.active, .start {
    background: #171b20;
    color: #fff8ec;
  }
  .timeline {
    margin-top: 18px;
    position: relative;
    padding-left: 21px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    border-radius: 999px;
    background: linear-gradient(#9fbea7, #496fbc 48%, #c47b58);
  }
  .event {
    position: relative;
    display: grid;
    grid-template-columns: 43px 1fr;
    gap: 9px;
    align-items: start;
    padding: 10px 10px 10px 0;
    margin-bottom: 7px;
    font-size: 10px;
  }
  .event::before {
    content: "";
    position: absolute;
    left: -18px;
    top: 17px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #9fbea7;
    box-shadow: 0 0 0 4px #fbfaf7;
  }
  .event.selected {
    margin-left: -8px;
    padding: 11px 11px 11px 8px;
    border-radius: 18px;
    background: #1f242b;
    color: #fff8ec;
    box-shadow: 0 14px 32px rgba(31,36,43,.2);
  }
  .event.selected::before {
    left: -10px;
    background: #e3b99e;
    box-shadow: 0 0 0 4px #1f242b;
  }
  .time {
    color: #6f7782;
    font-weight: 760;
  }
  .selected .time { color: rgba(255,248,236,.66); }
  .event-title {
    font-weight: 820;
    line-height: 1.22;
  }
  .event-note {
    margin-top: 2px;
    color: #6f7782;
    font-weight: 520;
    line-height: 1.25;
  }
  .selected .event-note { color: rgba(255,248,236,.64); }
  .nav {
    margin-top: auto;
    height: 49px;
    border-radius: 999px;
    background: rgba(255,255,255,.78);
    border: 1px solid rgba(23,27,32,.08);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    font-size: 9px;
    color: #77808b;
    text-align: center;
    backdrop-filter: blur(18px);
  }
  .on { color: #1f2933; font-weight: 850; }
</style>
