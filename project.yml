name: ToughTrial
options:
  bundleIdPrefix: com.xiaoyuliu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FocusTimelineCore:
    path: .
targets:
  ToughTrial:
    type: application
    platform: iOS
    sources:
      - path: Sources/ToughTrialApp
    dependencies:
      - package: FocusTimelineCore
        product: FocusTimelineCore
    info:
      path: Sources/ToughTrialApp/Info.plist
      properties:
        CFBundleDisplayName: Tough Trial
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
