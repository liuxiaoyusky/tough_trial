  <circle cx="440" cy="494" r="7.2" class="ring blue faded"/><circle cx="440" cy="494" r="5.2" class="progress"/>
  <text x="460" y="502" font-size="18" class="done">对标账号</text><path d="M461 518H536" class="wire blue faded" stroke-width="2"/><text x="460" y="545" font-size="15" class="muted">已完成</text>
  <circle cx="674" cy="494" r="7.2" class="ring blue"/><path d="M674 494L674 488.8A5.2 5.2 0 0 1 674 499.2Z" class="progress"/>
  <text x="694" y="502" font-size="18">爆款拆解</text><path d="M695 518H770" class="wire blue" stroke-width="2"/>

  <circle cx="939" cy="494" r="7.2" class="ring violet"/>
  <text x="959" y="502" font-size="18">每日记录</text><path d="M960 518H1035" class="wire violet" stroke-width="2"/>
  <circle cx="1100" cy="494" r="7.2" class="ring violet"/>
  <text x="1120" y="502" font-size="18">周复盘</text><path d="M1121 518H1178" class="wire violet" stroke-width="2"/>

  <circle cx="578" cy="674" r="7.2" class="ring blue faded"/><circle cx="578" cy="674" r="5.2" class="progress"/>
  <text x="598" y="682" font-size="18" class="done">收集样本</text><path d="M599 698H674" class="wire blue faded" stroke-width="2"/><text x="598" y="725" font-size="15" class="muted">已完成</text>
  <circle cx="800" cy="674" r="7.2" class="ring blue"/>
  <text x="820" y="682" font-size="18">拆解开头</text><path d="M821 698H896" class="wire blue" stroke-width="2"/>
  <text x="48" y="801" font-size="16" class="muted">分支色表示归属，圈内绿色表示进度；完成同时灰显、划线。</text>
</svg>
