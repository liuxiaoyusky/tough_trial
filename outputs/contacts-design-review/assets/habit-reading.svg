<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>阅读 · 实际记录（无账单） · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">读一页书</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">今日规划 · 9 月 21 日</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600">收起</text><text x="24" y="149" font-size="12" fill="#78818D" font-weight="400">计划</text><text x="24" y="179" font-size="18" fill="#17212D" font-weight="650">20:30 · 目标 1 页</text><path d="M36 204H354" stroke="#E5E4DF"/><text x="24" y="240" font-size="12" fill="#78818D" font-weight="400">实际</text><rect x="20" y="258" width="350" height="72" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="286" font-size="18" fill="#17212D" font-weight="650">今天读了 3 页</text><text x="305" y="286" font-size="14" fill="#1467E8" font-weight="600">3 页</text><text x="24" y="367" font-size="13" fill="#78818D" font-weight="400">Comment</text><rect x="20" y="385" width="350" height="104" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="418" font-size="15" fill="#17212D" font-weight="400">这一章比预想容易，顺手多读了两页。</text><text x="36" y="463" font-size="12" fill="#78818D" font-weight="400">继续写，也可以说一句…</text><rect x="20" y="530" width="350" height="36" rx="12" fill="#1467E8" stroke="none"/><text x="32" y="553" font-size="13" fill="white" font-weight="600">保存记录</text><rect x="20" y="582" width="350" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="32" y="605" font-size="13" fill="#1467E8" font-weight="600">✓ 完成</text><text x="24" y="650" font-size="12" fill="#687585" font-weight="400">保存记录不会自动完成任务。</text><text x="24" y="675" font-size="12" fill="#687585" font-weight="400">这个实例没有金额，因此不出现记账操作。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text></svg>