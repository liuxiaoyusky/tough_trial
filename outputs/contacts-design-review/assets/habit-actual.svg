<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>早餐 · 补充实际 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">早餐</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">今日规划 · 9 月 21 日</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600">收起</text><text x="24" y="149" font-size="12" fill="#78818D" font-weight="400">计划</text><text x="24" y="179" font-size="18" fill="#17212D" font-weight="650">08:30 · 预计 ¥12</text><path d="M36 204H354" stroke="#E5E4DF"/><text x="24" y="240" font-size="16" fill="#17212D" font-weight="600">实际发生了什么？</text><rect x="20" y="258" width="350" height="126" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="290" font-size="17" fill="#17212D" font-weight="400">今天买了一个菠萝包，13 元。</text><text x="36" y="320" font-size="17" fill="#17212D" font-weight="400">比平时晚了十分钟出门。</text><text x="36" y="361" font-size="12" fill="#78818D" font-weight="400">继续写，也可以说一句…</text><text x="325" y="361" font-size="10" fill="#1467E8" font-weight="400">麦克风</text><rect x="20" y="408" width="350" height="135" rx="18" fill="#EFF5FD" stroke="#D9E6F7"/><text x="36" y="436" font-size="12" fill="#687585" font-weight="400">账单草稿 · 尚未入账</text><text x="36" y="475" font-size="30" fill="#17212D" font-weight="750">¥13.00</text><rect x="231" y="449" width="119" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="243" y="472" font-size="13" fill="#1467E8" font-weight="600">餐饮 ▾</text><text x="36" y="521" font-size="13" fill="#687585" font-weight="400">支出 · 人民币 · 今天</text><text x="24" y="580" font-size="12" fill="#687585" font-weight="400">只记实际支出，预计的 ¥12 不计入账单。</text><rect x="20" y="604" width="350" height="36" rx="12" fill="#1467E8" stroke="none"/><text x="32" y="627" font-size="13" fill="white" font-weight="600">✓ 完成并记账</text><rect x="20" y="653" width="168" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="32" y="676" font-size="13" fill="#1467E8" font-weight="600">仅完成任务</text><rect x="202" y="653" width="168" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="214" y="676" font-size="13" fill="#1467E8" font-weight="600">先保存记录</text><text x="24" y="728" font-size="12" fill="#78818D" font-weight="400">金额或分类未明确时，先补齐账单草稿。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text></svg>