<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>今天 · 完成与未完成 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">今天</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">9 月 21 日 · 星期一</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600">＋ 添加</text><rect x="20" y="132" width="350" height="106" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="166" font-size="23" fill="#17212D" font-weight="700">先开始一件事</text><text x="36" y="196" font-size="14" fill="#687585" font-weight="400">今天的记录，都留在下面。</text><text x="24" y="275" font-size="18" fill="#17212D" font-weight="650">执行中 · 0</text><text x="24" y="318" font-size="20" fill="#17212D" font-weight="700">今日规划 · 3</text><rect x="20" y="338" width="350" height="142" rx="18" fill="#EFF6EF" stroke="#E5E4DF"/><text x="36" y="370" font-size="17" fill="#168264" font-weight="650">✓ 早餐</text><text x="36" y="400" font-size="14" fill="#17212D" font-weight="400">预计 ¥12 → 实际 ¥13</text><text x="36" y="427" font-size="14" fill="#687585" font-weight="400">今天买了一个菠萝包。</text><text x="36" y="456" font-size="13" fill="#1467E8" font-weight="400">餐饮 · 已入账 ↗</text><text x="305" y="370" font-size="12" fill="#1467E8" font-weight="400">恢复</text><rect x="20" y="494" width="350" height="94" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="523" font-size="16" fill="#17212D" font-weight="600">20:30  读一页书</text><text x="36" y="547" font-size="13" fill="#687585" font-weight="400">目标 1 页 · 累计 38 分钟</text><text x="36" y="570" font-size="12" fill="#687585" font-weight="400">开始    完成    ⋯</text><text x="303" y="523" font-size="12" fill