<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>任务 · 时间 · 重复规则 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">重复规则</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">任务 · 时间 · 设置一次，每天自然出现</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600">＋ 新建</text><rect x="20" y="136" width="350" height="94" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="165" font-size="16" fill="#17212D" font-weight="600">早餐</text><text x="36" y="189" font-size="13" fill="#687585" font-weight="400">周一至周五 · 08:30</text><text x="36" y="212" font-size="12" fill="#687585" font-weight="400">预计 ¥12 · 餐饮</text><text x="303" y="165" font-size="12" fill="#168264" font-weight="400">启用</text><rect x="20" y="244" width="350" height="94" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="273" font-size="16" fill="#17212D" font-weight="600">读一页书</text><text x="36" y="297" font-size="13" fill="#687585" font-weight="400">每天 · 20:30</text><text x="36" y="320" font-size="12" fill="#687585" font-weight="400">目标 1 页</text><text x="303" y="273" font-size="12" fill="#168264" font-weight="400">启用</text><rect x="20" y="352" width="350" height="94" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="381" font-size="16" fill="#17212D" font-weight="600">坐车去公司</text><text x="36" y="405" font-size="13" fill="#687585" font-weight="400">周一至周五 · 09:00</text><text x="36" y="428" font-size="12" fill="#687585" font-weight="400">预计 30 分钟 · ¥10.20</text><text x="303" y="381" font-size="12" fill="#168264" font-weight="400">启用</text><text x="24" y="488" font-size="17" fill="#17212D" font-weight="650">规则决定安排，实际由你记录</text><text x="24" y="518" font-size="13" fill="#687585" font-weight="400">暂停规则后，不再生成新的每日任务。</text><text x="24" y="543" font-size="13" fill="#687585" font-weight="400">已经发生的执行和账单会保留。</text><rect x="20" y="586" width="350" height="115" rx="18" fill="#EEF3FA" stroke="none"/><text x="36" y="615" font-size="16" fill="#17212D" font-weight="600">没有固定时间也可以</text><text x="36" y="643" font-size="13" fill="#687585" font-weight="400">例如：每天喝一杯水、读一页书。</text><text x="36" y="669" font-size="13" fill="#687585" font-weight="400">当天任务会显示为「时间不限」。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text></svg>