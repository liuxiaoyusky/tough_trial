<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>重复规则 · 跨天生成契约 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">跨天怎么生成</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">规则只生成当天实例</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600"></text><rect x="20" y="132" width="350" height="132" rx="18" fill="#EEF3FA" stroke="none"/><text x="36" y="162" font-size="16" fill="#17212D" font-weight="650">周五 · 早餐</text><text x="36" y="191" font-size="13" fill="#687585" font-weight="400">今天未完成</text><text x="36" y="220" font-size="13" fill="#687585" font-weight="400">周五状态只属于周五这一个实例。</text><text x="36" y="244" font-size="13" fill="#687585" font-weight="400">周末：规则不生成。</text><rect x="20" y="282" width="350" height="118" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="314" font-size="16" fill="#17212D" font-weight="650">周一 · 早餐</text><text x="36" y="343" font-size="13" fill="#687585" font-weight="400">08:30 · 预计 ¥12 · 未开始</text><text x="36" y="372" font-size="13" fill="#687585" font-weight="400">这是新的当日实例，不继承周五未完成。</text><text x="24" y="444" font-size="17" fill="#17212D" font-weight="650">每日阅读</text><text x="24" y="476" font-size="13" fill="#687585" font-weight="400">9/21  计划 1 页 → 实际 3 页 · 已完成</text><text x="24" y="506" font-size="13" fill="#687585" font-weight="400">9/22  新实例仍是目标 1 页 · 今日用时 0分</text><path d="M36 538H354" stroke="#E5E4DF"/><text x="24" y="575" font-size="14" fill="#17212D" font-weight="650">生成去重</text><text x="24" y="603" font-size="13" fill="#687585" font-weight="400">同一规则 + 同一本地日期，只能生成一次。</text><text x="24" y="631" font-size="13" fill="#687585" font-weight="400">多次打开或多设备同步都不能重复创建。</text><text x="24" y="696" font-size="12" fill="#78818D" font-weight="400">暂停规则只影响未来尚未生成的日期。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text></svg>