<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>新建重复规划 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="75" font-size="14" fill="#687585" font-weight="400">取消</text><text x="123" y="75" font-size="18" fill="#17212D" font-weight="650">新建重复规划</text><text x="329" y="75" font-size="14" fill="#1467E8" font-weight="600">保存</text><text x="24" y="149" font-size="25" fill="#17212D" font-weight="700">工作日早上吃早餐</text><text x="24" y="191" font-size="16" fill="#17212D" font-weight="400">08:30，预计 12 元，分类：餐饮</text><text x="24" y="221" font-size="16" fill="#17212D" font-weight="400">周末不安排。</text><path d="M36 248H354" stroke="#E5E4DF"/><text x="24" y="282" font-size="13" fill="#78818D" font-weight="400">从这段话整理出的规则</text><rect x="24" y="301" width="135" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="36" y="324" font-size="13" fill="#1467E8" font-weight="600">周一至周五 ▾</text><rect x="169" y="301" width="97" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="181" y="324" font-size="13" fill="#1467E8" font-weight="600">08:30 ▾</text><rect x="24" y="350" width="115" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="36" y="373" font-size="13" fill="#1467E8" font-weight="600">预计 ¥12</text><rect x="149" y="350" width="119" height="36" rx="12" fill="#EEF1F5" stroke="none"/><text x="161" y="373" font-size="13" fill="#1467E8" font-weight="600">餐饮 ✓</text><text x="24" y="424" font-size="14" fill="#17212D" font-weight="400">9 月 22 日开始</text><text x="24" y="451" font-size="12" fill="#687585" font-weight="400">修改这些小项，或直接继续改上面的文字。</text><rect x="20" y="495" width="350" height="117" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="525" font-size="12" fill="#78818D" font-weight="400">明天会出现</text><text x="36" y="555" font-size="17" fill="#17212D" font-weight="600">08:30  工作日早上吃早餐</text><text x="36" y="583" font-size="13" fill="#687585" font-weight="400">预计 ¥12 · 未开始</text><text x="24" y="674" font-size="13" fill="#78818D" font-weight="400">保存规则不会生成消费账单。</text><text x="24" y="697" font-size="13" fill="#78818D" font-weight="400">当前选择的餐饮分类由你确认。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text>