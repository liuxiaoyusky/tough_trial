<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>通勤 · 实际偏差 · 设计稿</title><rect width="390" height="844" rx="28" fill="#F7F6F2"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}</style><text x="24" y="31" font-size="12" fill="#78818D" font-weight="400">08:42</text><text x="283" y="31" font-size="11" fill="#78818D" font-weight="400">设计预览</text><text x="24" y="79" font-size="29" fill="#17212D" font-weight="750">坐车去公司</text><text x="24" y="106" font-size="12" fill="#78818D" font-weight="400">9 月 21 日 · 执行已结束</text><text x="302" y="76" font-size="13" fill="#1467E8" font-weight="600">收起</text><rect x="20" y="133" width="350" height="113" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="162" font-size="15" fill="#687585" font-weight="400">计划 09:00 出发 · 30 分钟</text><text x="36" y="192" font-size="17" fill="#17212D" font-weight="650">实际 09:10–09:55 · 45 分钟</text><text x="36" y="223" font-size="14" fill="#687585" font-weight="400">预计 ¥10.20 → 实际 ¥28.20</text><text x="24" y="289" font-size="16" fill="#17212D" font-weight="650">途中记录</text><text x="24" y="325" font-size="16" fill="#17212D" font-weight="400">公交晚点，坐了一段后换打车。</text><text x="24" y="355" font-size="16" fill="#17212D" font-weight="400">公交 10.2 元，打车另花了 18 元。</text><path d="M36 384H354" stroke="#E5E4DF"/><text x="24" y="421" font-size="16" fill="#17212D" font-weight="650">2 笔账单草稿</text><rect x="20" y="440" width="350" height="137" rx="18" fill="#FFFEFA" stroke="#E5E4DF"/><text x="36" y="475" font-size="16" fill="#17212D" font-weight="400">公交</text><text x="277" y="475" font-size="16" fill="#17212D" font-weight="650">¥10.20</text><text x="36" y="501" font-size="12" fill="#687585" font-weight="400">交通 · 支出</text><path d="M36 516H354" stroke="#E5E4DF"/><text x="36" y="546" font-size="16" fill="#17212D" font-weight="400">打车</text><text x="277" y="546" font-size="16" fill="#17212D" font-weight="650">¥18.00</text><text x="24" y="607" font-size="14" fill="#1467E8" font-weight="400">分类：交通 ▾</text><text x="24" y="635" font-size="12" fill="#687585" font-weight="400">确认后共入账 ¥28.20，不另外记预计金额。</text><rect x="20" y="664" width="350" height="36" rx="12" fill="#1467E8" stroke="none"/><text x="32" y="687" font-size="13" fill="white" font-weight="600">✓ 完成并记账 · 2 笔</text><text x="24" y="731" font-size="12" fill="#78818D" font-weight="400">记录与账单双向关联，可回看、可更正。</text><rect x="0" y="770" width="390" height="74" fill="#FFFFFF" stroke="#E7E9ED"/><g transform="translate(39,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L2 -3L8 0L2 3L0 10L-2 3L-8 0L-2 -3Z M8 -10v5 M5.5 -7.5h5"/></g><text x="39" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">助手</text><g transform="translate(115,792)" fill="none" stroke="#1467E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="18" rx="3"/><path d="M-10 -2h20 M-5 -11v6 M5 -11v6 M-5 3h2 M2 3h2 M-5 7h2"/></g><text x="115" y="819" text-anchor="middle" font-size="10" style="fill:#1467E8">今天</text><g transform="translate(191,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10L11 -5L0 0L-11 -5Z M-11 0L0 5L11 0 M-11 5L0 10L11 5"/></g><text x="191" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">任务</text><g transform="translate(267,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 -8h-10v18h18V0 M-2 4l1 -5L7 -9L11 -5L3 3Z M5 -7l4 4"/></g><text x="267" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">随手记</text><g transform="translate(343,792)" fill="none" stroke="#7A8493" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="10"/><circle cx="-5" r=".7"/><circle r=".7"/><circle cx="5" r=".7"/></g><text x="343" y="819" text-anchor="middle" font-size="10" style="fill:#7A8493">更多插件</text></svg>