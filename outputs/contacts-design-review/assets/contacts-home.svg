<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>联系人首页</title><rect width="390" height="844" fill="#F6F7F9"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;fill:#111827} .muted{fill:#7A8493} .blue{fill:#1467E8} .white{fill:#fff} .small{font-size:12px} .body{font-size:15px} .label{font-size:13px;font-weight:600} .title{font-size:28px;font-weight:750} .h2{font-size:20px;font-weight:700} .h3{font-size:17px;font-weight:650} </style><rect x="0" y="0" width="390" height="96" fill="#F6F7F9"/><text x="24" y="38" class="small muted">20:38</text><text x="24" y="78" class="title">联系人</text><text x="366" y="76" text-anchor="end" class="body blue">＋</text><rect x="20" y="108" width="350" height="112" rx="22" fill="#F0F6FF" stroke="#D8E7FF"/><circle cx="70" cy="164" r="31" fill="#DDEBFF"/><text x="70" y="171" text-anchor="middle" class="h2 blue">我</text><text x="116" y="143" class="label blue">我的名片</text><text x="116" y="169" class="h3">Sky Liu</text><text x="116" y="192" class="small muted">工作名片 · 点击即可分享</text><text x="340" y="169" text-anchor="middle" class="h2 muted">›</text><rect x="20" y="236" width="350" height="40" rx="12" fill="#ECEFF3"/><text x="44" y="261" class="body muted">⌕  搜索姓名、公司、电话、备注</text><g><rect x="20" y="290" width="350" height="40" rx="12" fill="#EAEEF5"/><rect x="22" y="292" width="114" height="36" rx="10" fill="#FFFFFF"/><text x="79" y="316" text-anchor="middle" class="label">人物</text><text x="195" y="316" text-anchor="middle" class="label muted">公司</text><text x="311" y="316" text-anchor="middle" class="label muted">最近</text></g><rect x="20" y="348" width="350" height="76" rx="18" fill="#FFFFFF" stroke="#E8EBEF"/><circle cx="58" cy="386" r="23" fill="#EEF2F7"/><text x="58" y="392" text-anchor="middle" class="h3">陈</text><text x="94" y="379" class="h3">陈一鸣</text><text x="94" y="403" class="small muted">星河科技 · 产品</text><text x="345" y="392" text-anchor="m